<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site-theme.css' | relative_url }}">
  {% seo %}
</head>
<body class="site-shell{% if page.body_class %} {{ page.body_class }}{% endif %}">
  {% include header.html %}
  <main class="page-main">
    {{ content }}
  </main>

  {% include footer.html %}
  <button class="back-to-top" type="button" aria-label="返回顶部" data-back-to-top><i class="fas fa-arrow-up" aria-hidden="true"></i></button>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
